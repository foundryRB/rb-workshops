apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  # The platform pauses an app by overriding .Values.paused on its ArgoCD
  # Application (ADR-030); docs stay served, this workload scales to zero.
  replicas: {{ if .Values.paused }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
      annotations:
        # Arms the ConfigMap's change on the POD TEMPLATE: a config-only edit
        # would otherwise sync as a silent no-op (REF-Foundry section 4).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- if .Values.events.enabled }}
      initContainers:
        # A NATS client reads one credentials file; the grant delivers its two
        # halves as two Secrets, because reflecting them together would have
        # carried the private seed out of this namespace. Assembling them here
        # keeps that boundary and costs one short init step. Uses the app's own
        # image so the pod pulls nothing extra.
        - name: assemble-nats-creds
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              {
                echo '-----BEGIN NATS USER JWT-----'
                echo "$(cat /jwt/user.jwt)"
                echo '------END NATS USER JWT------'
                echo
                echo '-----BEGIN USER NKEY SEED-----'
                echo "$(cat /seed/seed)"
                echo '------END USER NKEY SEED------'
              } > /out/app.creds
              chmod 400 /out/app.creds
              echo "assembled the bus credentials"
          volumeMounts:
            - { name: nats-seed, mountPath: /seed, readOnly: true }
            - { name: nats-jwt, mountPath: /jwt, readOnly: true }
            - { name: nats-creds, mountPath: /out }
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}
          env:
            {{- if .Values.auth.oidc.enabled }}
            # The fleet's spelling of "this app's key gates the machine door
            # and nothing else" (REF-Foundry section 3's mcp-split rule,
            # INT-FOUNDRY-037), beside the sidecar below that fronts every
            # other route (ADR-006). The literal double-quoted value is a
            # conformance assertion on the template text; do not templatize it.
            # Rendered only with the sidecar: without a gate declared in front,
            # the engine answers 503 on every human surface rather than open.
            - name: WORKSHOPS_AUTH_SCOPE
              value: "mcp"
            {{- end }}
            # The machine door's own key, minted by this chart ahead of the
            # Deployment (templates/mcp-key.yaml, ADR-006): required, so the
            # pod never starts without it.
            - name: WORKSHOPS_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpKey.secretName }}
                  key: WORKSHOPS_AUTH_USER
            - name: WORKSHOPS_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpKey.secretName }}
                  key: WORKSHOPS_AUTH_PASSWORD
            {{- if .Values.database.enabled }}
            # Only the password is platform-minted; it is never optional, so a
            # missing grant holds the pod at CreateContainerConfigError, where
            # the absent Secret is named (INT-FOUNDRY-062).
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "set database.existingSecret" .Values.database.existingSecret }}
                  key: password
            {{- end }}
            {{- if .Values.events.enabled }}
            - name: NATS_URL
              value: {{ .Values.events.servers | quote }}
            - name: NATS_CREDS
              value: /var/run/nats/app.creds
            {{- end }}
          volumeMounts:
            # Two operator-seeded, optional credentials, read at use time from
            # their mounted files rather than at start: a publish or a render
            # refuses until the file exists, and the pod serves everything else.
            - name: githome
              mountPath: /var/run/githome
              readOnly: true
            - name: renderer-source
              mountPath: /var/run/renderer-source
              readOnly: true
            - name: renderer-cache
              mountPath: /var/cache/renderer
            {{- if .Values.events.enabled }}
            - name: nats-creds
              mountPath: /var/run/nats
              readOnly: true
            {{- end }}
          # TCP probes: /api/health is open, but the human surfaces answer 503
          # under any gate shape but the sidecar's, and a listening socket is
          # the right liveness signal either way.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.auth.oidc.enabled }}
        # The proxy sidecar (ADR-006, REF-Foundry section 5: the grant renders
        # the realm, this chart renders the gate). --provider=oidc, never
        # keycloak-oidc (INT-FOUNDRY-057); the singular --api-route makes an
        # unauthenticated REST call answer 401 rather than a login redirect a
        # machine cannot follow; /mcp is skipped with its auth header kept so
        # the machine door reaches the app's own key; /api/health stays open
        # for the platform's probe.
        - name: oauth2-proxy
          image: "{{ .Values.auth.proxyImage }}"
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:{{ .Values.port }}
            - --provider=oidc
            - --oidc-issuer-url={{ required "set auth.oidc.issuer on the deploy branch" .Values.auth.oidc.issuer }}
            - --client-id={{ .Values.auth.oidc.clientId }}
            - --email-domain=*
            - --redirect-url=https://{{ required "set host on the deploy branch" .Values.host }}/oauth2/callback
            - --cookie-secure=true
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --skip-auth-route=^/mcp(/|$)
            - --skip-auth-route=^/api/health$
            - --skip-auth-strip-headers=false
            - --api-route=^/api/
          env:
            # Mapped key by key, never envFrom (whose variable names would be
            # the Secret's keys rather than the ones the proxy reads).
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "set auth.oidc.existingSecret" .Values.auth.oidc.existingSecret }}
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: cookieSecret
          ports:
            - name: oidc
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: oidc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: oidc
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        {{- end }}
      volumes:
        - name: githome
          secret:
            secretName: {{ .Values.githome.existingSecret }}
            optional: true
        - name: renderer-source
          secret:
            secretName: {{ .Values.renderer.existingSecret }}
            optional: true
        - name: renderer-cache
          emptyDir: {}
        {{- if .Values.events.enabled }}
        # Neither Secret is optional: a missing grant holds the pod at
        # CreateContainerConfigError, where the absent Secret is named.
        - name: nats-seed
          secret:
            secretName: {{ required "set events.seedSecret" .Values.events.seedSecret }}
        - name: nats-jwt
          secret:
            secretName: {{ required "set events.jwtSecret" .Values.events.jwtSecret }}
        - name: nats-creds
          emptyDir: {}
        {{- end }}
