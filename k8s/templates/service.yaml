apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - port: 80
      {{- if .Values.auth.oidc.enabled }}
      # The oauth2-proxy sidecar's port: it fronts the app container, so the
      # open backend is reachable only through the gate.
      targetPort: oidc
      {{- else }}
      targetPort: http
      {{- end }}
