[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vf-workshops"
version = "0.0.0"
description = "The workshops engine: typed working-session instruments, authored, run and exported."
requires-python = ">=3.11"
# Upper bounds are load-bearing: the image is built by a bare `pip install .`
# with no lockfile, so an unbounded floor resolves to whatever is newest on
# build day. Cap each major; raise a cap deliberately.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "mcp>=1.28,<2",
    "psycopg[binary,pool]>=3.1,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "csd-pytest-intent~=0.3.0",
    "csd-intent>=0.6.0,<0.7",
    "pyyaml>=6",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["**/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies in argument defaults by design.
"backend/adapters/api/routes.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
